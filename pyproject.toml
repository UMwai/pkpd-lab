[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pkpd-lab"
version = "0.2.0"
description = "An inspectable workbench for compartmental PK/PD research"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<4",
  "pydantic>=2.9,<3",
  "plotly>=5.24,<7",
  "streamlit>=1.56,<2",
]

[project.scripts]
pkpd = "pkpd_lab.cli:main"
pkpd-lab = "pkpd_lab.lab_cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
